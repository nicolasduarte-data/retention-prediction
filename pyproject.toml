[project]
name = "retention-prediction"
version = "0.1.0"
description = "Production-grade behavioral retention prediction for senior People Analytics roles. Reads HRIS features from pa-warehouse (BigQuery), ships dual-cohort comparison + survival arm + fairness audit + interpretability deep-dive against a synthetic 2,500-employee mart."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Nicolas Duarte", email = "ingnicolasduarte@gmail.com" },
]
keywords = [
    "people-analytics",
    "hr-data-science",
    "attrition-prediction",
    "survival-analysis",
    "fairness",
    "interpretability",
    "machine-learning",
    "bigquery",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "alibi>=0.9",
    "dice-ml>=0.11",
    "fairlearn>=0.10",
    "google-cloud-bigquery>=3.20",
    "interpret>=0.5",
    "jupyterlab>=4.0",
    "lifelines>=0.30.3",
    "lightgbm>=4.0",
    "llvmlite>=0.42",
    "matplotlib>=3.8",
    "mlflow>=2.12",
    "numba>=0.59",
    "numpy>=1.24",
    "pandas>=2.0",
    "pandas-gbq>=0.22",
    "plotly>=5.20",
    "scikit-learn>=1.4",
    "scikit-survival>=0.22",
    "seaborn>=0.13",
    "shap>=0.45",
    "survshap>=0.4",
    "xgboost>=2.0",
]

[project.urls]
Repository = "https://github.com/nicolasduarte-data/retention-prediction"
Issues = "https://github.com/nicolasduarte-data/retention-prediction/issues"
Documentation = "https://github.com/nicolasduarte-data/retention-prediction#readme"

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "mutmut>=2.4,<3",
    "mypy>=1.10",
    "nbmake>=1.5",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

# --------------------------------------------------------------------- #
# Build system — setuptools per BACKLOG.md Stack Decisions               #
# --------------------------------------------------------------------- #
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["retention*"]

# --------------------------------------------------------------------- #
# Tooling configuration (Story 0.3 — pre-commit hooks will reference this)
# --------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/**"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "docs", "tests"]
exclude = ["scripts/"]

# Tests can be less strict — pytest fixtures and monkeypatch don't carry
# type annotations on every helper. src/ remains under full strict mode.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


# ── Mutation testing — Story 3.7 ─────────────────────────────────────────────
# Target: < 5 surviving mutants on src/retention/evaluation/.
# Runner scoped to the 5 evaluation-specific test files plus -x (stop at first
# failure) so each killed mutant pays only one test session, not 266.
# simple_output avoids emoji encoding errors on Windows cp1252 consoles.
[tool.mutmut]
paths_to_mutate = "src/retention/evaluation/"
runner = "python -m pytest tests/test_evaluation.py tests/test_metrics.py tests/test_expected_value.py tests/test_champion.py tests/test_nested_cv.py -x --tb=no -q"
tests_dir = "tests/"
simple_output = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
